services:
  app-db:
    image: postgres:16-alpine
    container_name: app-db
    environment:
      POSTGRES_DB: demo_db
      POSTGRES_USER: demo_user
      POSTGRES_PASSWORD: demo_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo_user -d demo_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  app-service:
    build: ./app
    container_name: app-service
    environment:
      DB_HOST: app-db
      DB_NAME: demo_db
      DB_USER: demo_user
      DB_PASSWORD: demo_pass
      DB_PORT: 5432
    ports:
      - "8080:8080"
    depends_on:
      app-db:
        condition: service_healthy
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
